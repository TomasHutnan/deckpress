# Production on the VPS. caddy-docker-proxy and homepage find the service through
# its labels, on the shared `web` network. No port is published.
#
# Values come from .env next to this file, copied from .env.example. Compose reads
# it by itself. Never put real values in this file: the repository is public.
#
#   docker compose -f compose.vps.yaml up -d --build     build & start
#   docker compose -f compose.vps.yaml pull && up -d     update from registry
services:
  deckpress:
    image: ghcr.io/tomashutnan/deckpress:${DECKPRESS_IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    environment:
      - DECKPRESS_USER=${DECKPRESS_USER:-tomas}
      - DECKPRESS_PASSWORD_HASH=${DECKPRESS_PASSWORD_HASH:?run npm run hash-password and put the line in .env}
    volumes:
      # Per-game Git repos & assets across restarts. Must be owned by uid 1000.
      - ${DECKPRESS_DATA_PATH:?set it in .env}:/data
    networks:
      - web
    # Read-only rootfs; only /data and tmpfs (/tmp, /home/node/.cache for Chromium) are writable.
    read_only: true
    tmpfs:
      - /tmp
      - /home/node/.cache
    shm_size: "256mb"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    labels:
      caddy: ${DECKPRESS_DOMAIN}
      caddy.encode: zstd gzip
      caddy.reverse_proxy: "{{upstreams 8080}}"
      homepage.group: Services
      homepage.name: DeckPress
      homepage.href: https://${DECKPRESS_DOMAIN}
      homepage.description: Card game design studio
      homepage.icon: mdi-cards

networks:
  web:
    external: true
