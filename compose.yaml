services:
  deckpress:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    volumes:
      - "${DECKPRESS_DATA_HOST_DIR:-~/data/deckpress}:/data"
    # Read-only rootfs; only /data and tmpfs (/tmp, /home/node/.cache for Chromium) are writable.
    read_only: true
    tmpfs:
      - /tmp
      - /home/node/.cache
    shm_size: "256mb"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
